<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Cuántos días faltan? | cuantosdiasfaltan.xyz</title>
  <meta name="description" content="Contador simple y rápido: descubre cuántos días faltan para quincena, puente, Navidad o cualquier fecha." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-amber-50 via-orange-50 to-white text-slate-900">
  <main class="mx-auto w-full max-w-md px-4 py-6 sm:max-w-3xl sm:px-6 sm:py-10">
    <section class="rounded-2xl border border-orange-100 bg-white p-5 shadow-sm sm:p-8">
      <h1 class="text-3xl font-extrabold leading-tight sm:text-5xl">¿Cuántos días faltan?</h1>
      <p class="mt-2 text-sm text-slate-600 sm:text-base">Elige una fecha y te digo cuántos días faltan.</p>

      <div class="mt-4 flex flex-col gap-2 sm:flex-row">
        <input id="fecha" type="date" class="w-full rounded-xl border border-orange-200 px-3 py-2" />
        <button id="calc" class="rounded-xl bg-orange-600 px-4 py-2 font-bold text-white hover:bg-orange-700">Calcular</button>
      </div>

      <div id="r" class="mt-4 rounded-xl border border-orange-200 bg-orange-50 p-4 font-semibold">Selecciona una fecha para empezar.</div>    </section>

    <section class="mt-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:mt-6 sm:p-8">
      <h2 class="text-xl font-bold">Fechas populares</h2>
      <div class="mt-3 flex flex-wrap gap-2">
        <button data-tag="quincena" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">Próxima quincena</button>
        <button data-tag="navidad" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">Navidad</button>
        <button data-tag="anio" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">Año nuevo</button>
      </div>
      <div id="quick" class="mt-3 rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm">Tip: usa los botones para búsquedas comunes.</div>

      <h3 class="mt-5 text-lg font-bold">Festivos comunes en México</h3>
      <div class="mt-2 flex flex-wrap gap-2">
        <button data-holiday="new_year" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">1 de enero - Año Nuevo</button>
        <button data-holiday="constitution" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">Primer lunes de febrero - Constitución</button>
        <button data-holiday="juarez" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">Tercer lunes de marzo - Natalicio de Benito Juárez</button>
        <button data-holiday="labor_day" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">1 de mayo - Día del Trabajo</button>
        <button data-holiday="independence" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">16 de septiembre - Independencia</button>
        <button data-holiday="revolution" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">Tercer lunes de noviembre - Revolución Mexicana</button>
        <button data-holiday="christmas" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-bold hover:bg-slate-50">25 de diciembre - Navidad</button>
      </div>

      <div class="mt-5 flex flex-col gap-2 sm:flex-row">
        <a class="inline-flex items-center justify-center rounded-xl bg-teal-700 px-4 py-3 text-sm font-bold text-white hover:bg-teal-800" href="https://miqr.mx" target="_blank" rel="noopener">Ver herramienta</a>
        <a class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-bold text-slate-800 hover:bg-slate-50" href="https://mitote.world" target="_blank" rel="noopener">Promocionar negocio</a>
      </div>
    </section>
  </main>

  <script>
    const f=document.getElementById('fecha');
    const r=document.getElementById('r');
    const q=document.getElementById('quick');    const now=new Date();    f.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

    const days=(a,b)=>Math.ceil((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);

    function out(target,label='Esa fecha'){
      const d=days(new Date(),target);
      r.textContent=`${label}: faltan ${d} día${d===1?'':'s'} (${target.toLocaleDateString('es-MX')}).`;    }

    document.getElementById('calc').onclick=()=>{if(!f.value)return;out(new Date(f.value+'T00:00:00'),'Tu fecha')};

    function nextQuincena(){
      const d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
      if(day<=15)return new Date(y,m,15);
      return new Date(y,m+1,1);
    }

    function firstMonday(year, monthIndex){
      const d=new Date(year,monthIndex,1);
      d.setDate(1+((8-d.getDay())%7));
      return d;
    }

    function thirdMonday(year, monthIndex){
      const d=firstMonday(year,monthIndex);
      d.setDate(d.getDate()+14);
      return d;
    }

    function upcomingDate(makeDate){
      let d=makeDate(now.getFullYear());
      if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate())){
        d=makeDate(now.getFullYear()+1);
      }
      return d;
    }

    document.querySelectorAll('button[data-tag]').forEach(b=>b.onclick=()=>{
      const t=b.dataset.tag;
      let x;
      if(t==='quincena'){x=nextQuincena();q.textContent='Consulta más fechas financieras y de campañas.';out(x,'Próxima quincena')}
      if(t==='navidad'){x=new Date(now.getFullYear(),11,25);if(x<now)x=new Date(now.getFullYear()+1,11,25);q.textContent='Temporada alta: prepara promos con tiempo.';out(x,'Navidad')}
      if(t==='anio'){x=new Date(now.getFullYear()+1,0,1);q.textContent='Arranca año con campañas y metas claras.';out(x,'Año nuevo')}
    });

    document.querySelectorAll('button[data-holiday]').forEach(btn=>btn.onclick=()=>{
      const key=btn.dataset.holiday;
      let x;
      if(key==='new_year') x=upcomingDate(y=>new Date(y,0,1));
      if(key==='constitution') x=upcomingDate(y=>firstMonday(y,1));
      if(key==='juarez') x=upcomingDate(y=>thirdMonday(y,2));
      if(key==='labor_day') x=upcomingDate(y=>new Date(y,4,1));
      if(key==='independence') x=upcomingDate(y=>new Date(y,8,16));
      if(key==='revolution') x=upcomingDate(y=>thirdMonday(y,10));
      if(key==='christmas') x=upcomingDate(y=>new Date(y,11,25));
      if(!x) return;
      f.value=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
      q.textContent='Fecha cargada automáticamente desde festivos comunes.';
      out(x,btn.textContent);
    });
  </script>
</body>
</html>
